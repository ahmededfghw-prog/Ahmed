<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الصور والمنصة التفاعلية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        .light-theme {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 30px auto;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--card-bg);
        }

        h1 { font-size: 1.6rem; color: var(--accent-color); }

        .theme-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* معرض الصور */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .card img:hover { transform: scale(1.03); }

        .card-body { padding: 15px; text-align: center; }

        /* نموذج إرسال الرسائل إلى تلجرام */
        .contact-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .contact-box h2 {
            margin-bottom: 15px;
            color: var(--accent-color);
            text-align: center;
        }

        .form-group { margin-bottom: 15px; }

        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
        }

        .send-btn {
            width: 100%;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .send-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <h1>🖼️ معرض الصور والمنصة التفاعلية</h1>
        <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️ المظهر</button>
    </header>

    <div class="container">
        
        <!-- شبكة عرض الصور -->
        <div class="gallery-grid">
            <div class="card">
                <img src="3.JPG" alt="صورة 1" onerror="this.src='3.jpg'">
                <div class="card-body"><h3>صورة #1</h3></div>
            </div>
            <div class="card">
                <img src="4.JPG" alt="صورة 2" onerror="this.src='4.jpg'">
                <div class="card-body"><h3>صورة #2</h3></div>
            </div>
            <div class="card">
                <img src="5.WEBP" alt="صورة 3" onerror="this.src='5.webp'">
                <div class="card-body"><h3>صورة #3</h3></div>
            </div>
            <div class="card">
                <img src="6.JPG" alt="صورة 4" onerror="this.src='6.jpg'">
                <div class="card-body"><h3>صورة #4</h3></div>
            </div>
            <div class="card">
                <img src="7.PNG" alt="صورة 5" onerror="this.src='7.png'">
                <div class="card-body"><h3>صورة #5</h3></div>
            </div>
        </div>

        <!-- قسم أرسل رسالة إلى تلجرام -->
        <div class="contact-box">
            <h2>📬 أرسل رسالة مباشرة</h2>
            <form id="telegram-form">
                <div class="form-group">
                    <label for="name">الاسم:</label>
                    <input type="text" id="name" placeholder="اكتب اسمك هنا..." required>
                </div>
                <div class="form-group">
                    <label for="message">الرسالة:</label>
                    <textarea id="message" rows="4" placeholder="اكتب رسالتك..." required></textarea>
                </div>
                <button type="submit" class="send-btn">إرسال عبر تلجرام 🚀</button>
            </form>
        </div>

    </div>

    <script>
        // 1. تبديل وضع الليل والنهار
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        // 2. إرسال الرسالة إلى تلجرام رسميًا باستخدام Bot API
        document.getElementById('telegram-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const msg = document.getElementById('message').value;

            // تم إضافة بيانات البوت الخاصة بك
            const botToken = "8624749284:AAEMvDKtk_N5QR0Iiq3E2DTo5ErKb_dt0fM";
            const chatId = "1658368856";

            const text = `📬 رسالة جديدة من زائر الموقع:\n\n👤 الاسم: ${name}\n💬 الرسالة: ${msg}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        alert("تم إرسال رسالتك بنجاح! ✅");
                        document.getElementById('telegram-form').reset();
                    } else {
                        alert("حدث خطأ أثناء الإرسال. يرجى المحاولة لاحقاً.");
                    }
                })
                .catch(() => alert("تعذر الاتصال بالسيرفر."));
        });
    </script>
</body>
</html>
