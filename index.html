<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأدوات الذكية المجانية | Smart Web Tools</title>
    
    <!-- مكتبة صناعة الـ QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #0284c7;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 5px; }
        header p { color: #64748b; font-size: 0.95rem; }

        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* شريط التبويبات (Tabs) */
        .tabs {
            display: flex;
            background: #f1f5f9;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            background: none;
            font-size: 0.95rem;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        /* محتوى الأدوات */
        .tool-content {
            padding: 25px;
            display: none;
        }

        .tool-content.active {
            display: block;
        }

        /* تنسيقات المدخلات والأزرار */
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; }
        
        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus, textarea:focus { border-color: var(--primary); }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover { opacity: 0.9; }

        /* نتائج أداة العداد */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            text-align: center;
        }

        .stat-box {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .stat-num { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: #64748b; }

        /* أداة QR */
        .qr-output {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }

        /* أداة كلمة السر */
        .pass-display {
            background: #f1f5f9;
            padding: 12px;
            font-family: monospace;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛠️ منصة الأدوات الذكية</h1>
        <p>مجموعة من الخدمات السريعة والمجانية في مكان واحد</p>
    </header>

    <div class="main-card">
        <!-- أزرار التنقل -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('qr-tool', this)">📱 صانع QR</button>
            <button class="tab-btn" onclick="openTab('counter-tool', this)">📝 عداد النصوص</button>
            <button class="tab-btn" onclick="openTab('pass-tool', this)">🔐 صانع كلمة السر</button>
        </div>

        <!-- الخدمة الأولى: QR Code -->
        <div id="qr-tool" class="tool-content active">
            <label>أدخل الرابط أو النص:</label>
            <input type="text" id="qr-text" placeholder="https://example.com" value="https://google.com">
            
            <div class="qr-output">
                <div id="qrcode"></div>
            </div>

            <button class="btn" onclick="downloadQR()">تنزيل الرمز 📥</button>
        </div>

        <!-- الخدمة الثانية: عداد الحروف والكلمات -->
        <div id="counter-tool" class="tool-content">
            <label>اكتب أو الصق النص هنا:</label>
            <textarea id="text-input" rows="6" placeholder="ابدأ الكتابة هنا..."></textarea>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-num" id="char-count">0</div>
                    <div class="stat-label">عدد الحروف</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="word-count">0</div>
                    <div class="stat-label">عدد الكلمات</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="line-count">0</div>
                    <div class="stat-label">عدد الأسطر</div>
                </div>
            </div>
        </div>

        <!-- الخدمة الثالثة: مولّد كلمة سر قوية -->
        <div id="pass-tool" class="tool-content">
            <label>كلمة السر المولدّة:</label>
            <div class="pass-display" id="pass-output">اضغط إنشاء لتوليد كلمة سر</div>

            <label>طول كلمة السر:</label>
            <select id="pass-length">
                <option value="8">8 أحرف</option>
                <option value="12" selected>12 حرف (موصى به)</option>
                <option value="16">16 حرف</option>
            </select>

            <button class="btn" onclick="generatePassword()">توليد كلمة سر قوية 🎲</button>
        </div>
    </div>

    <script>
        // التنقل بين التبويبات
        function openTab(tabId, element) {
            document.querySelectorAll('.tool-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // --- 1. كود الـ QR Code ---
        let qrcode = new QRCode(document.getElementById("qrcode"), {
            width: 160,
            height: 160
        });

        document.getElementById('qr-text').addEventListener('input', function() {
            if(this.value.trim() !== "") {
                qrcode.makeCode(this.value);
            }
        });
        qrcode.makeCode(document.getElementById('qr-text').value);

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            if (img) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = 'qrcode.png';
                link.click();
            }
        }

        // --- 2. كود عداد النصوص ---
        document.getElementById('text-input').addEventListener('input', function() {
            const text = this.value;
            document.getElementById('char-count').innerText = text.length;
            
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('word-count').innerText = words;

            const lines = text ? text.split('\n').length : 0;
            document.getElementById('line-count').innerText = lines;
        });

        // --- 3. كود مولّد كلمات السر ---
        function generatePassword() {
            const length = document.getElementById('pass-length').value;
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
            let retVal = "";
            for (let i = 0, n = charset.length; i < length; ++i) {
                retVal += charset.charAt(Math.floor(Math.random() * n));
            }
            document.getElementById('pass-output').innerText = retVal;
        }
    </script>
</body>
</html>
